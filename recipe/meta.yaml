{% set name = "racerts" %}
{% set version = "0.1.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/racerts-{{ version }}.tar.gz
  sha256: 67168d953d12dc266e2e725bccde2a510ed32cec947a997d03ffe350389acd45

build:
  entry_points:
    - racerts = racerts.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77.0.3
    - pip
  run:
    - python >={{ python_min }}
    - rdkit >=2023.9.6
    - numpy >=1.26.4
    - py3Dmol >=2.0.0
    - ipython >=7.34.0

test:
  imports:
    - racerts
  commands:
    - pip check
    - racerts --help
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Rapid and Accurate Conformer Ensemble with RDKit for Transition States
  doc_url: https://digital-chemistry-laboratory.github.io/racerts/
  home: https://github.com/digital-chemistry-laboratory/racerts/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hesengg
